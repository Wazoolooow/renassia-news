name: Sync & Verify

on:
  push:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les caméras actives
        run: |
          echo "=== Vérification des streams HLS ==="
          grep "stream:'" index.html | grep -o "https://[^']*" | while read url; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 "$url")
            if [ "$code" = "200" ]; then
              echo "✅ $url"
            else
              echo "❌ MORT ($code): $url"
            fi
          done
